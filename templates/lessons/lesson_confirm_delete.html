{% extends 'base.html' %}

{% block title %}Delete Lesson - LMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border">
            <div class="card-header bg-white border-bottom py-3">
                <h4 class="mb-0 text-dark font-bold">Delete Module</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-secondary mb-2">Are you sure you want to remove lesson:</p>
                <h5 class="fw-bold text-dark mb-3">{{ lesson.title }}</h5>
                
                <p class="text-muted small mb-4">Course: {{ lesson.course.title }}</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'lessons:lesson_detail' lesson.course.slug lesson.pk %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Confirm Deletion</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

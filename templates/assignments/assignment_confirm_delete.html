{% extends 'base.html' %}

{% block title %}Delete Assignment | LMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-3 p-4 p-md-5 text-center">
            <div class="text-danger fs-1 mb-3">&#9888;&#65039;</div>
            <h4 class="fw-bold text-dark mb-2">Delete Assignment?</h4>
            <p class="text-secondary small mb-4">
                Are you sure you want to permanently delete <strong>"{{ assignment.title }}"</strong>? All student submissions and grading records will be deleted.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'assignments:assignment_detail' assignment.pk %}" class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-danger px-4">
                        Confirm Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

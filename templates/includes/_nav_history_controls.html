<div class="lms-nav-history" id="lmsNavHistory" role="group" aria-label="Page navigation history">
    <button type="button"
            id="btnNavBack"
            class="lms-history-btn is-disabled"
            title="Back to previous page"
            aria-label="Back to previous page"
            disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>
    <span class="lms-history-divider" aria-hidden="true"></span>
    <button type="button"
            id="btnNavForward"
            class="lms-history-btn is-disabled"
            title="Forward to next page"
            aria-label="Forward to next page"
            disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>
</div>
